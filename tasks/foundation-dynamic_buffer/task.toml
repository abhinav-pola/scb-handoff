schema_version = "1.1"
artifacts = []

[task]
name = "scb-handoff/foundation-dynamic_buffer"
description = "Code generator that infers data transformations from input/output examples and emits working code in Python, JS, C++, or Rust. Handles filtering, column ops, stateful transforms (prefix sums, sliding windows), and window functions. Generated code streams data with fixed buffers."
authors = [
    { name = "Gabriel Orlanski" },
]
keywords = [
    "code-generation",
    "metaprogramming",
    "streaming-algorithms",
    "multi-language",
    "transform-inference",
    "stateful-processing",
    "window-functions",
    "compiler-design",
    "scb-problem",
    "multi-step",
    "pytest",
]

[metadata]
difficulty = "hard"
category = "data-processing"
tags = [
    "code-generation",
    "metaprogramming",
    "streaming-algorithms",
    "multi-language",
    "transform-inference",
    "stateful-processing",
    "window-functions",
    "compiler-design",
]
source = "scb-problems"
source_problem = "dynamic_buffer"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[environment.env]
COLUMNS = "240"
LINES = "60"
PYTHONUNBUFFERED = "1"
TERM = "xterm"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[verifier]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = [
    "pypi.org",
    "files.pythonhosted.org",
]

[[steps]]
name = "checkpoint_1"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 1800.0
