schema_version = "1.1"
artifacts = []

[task]
name = "scb-handoff/foundation-etl_pipeline"
description = "CLI that parses and executes ETL pipelines defined in JSON. Supports select, filter, map, rename, and limit operations with a custom expression language. Adds conditional branching, reusable sub-pipelines with parameters, and a library system for modular definitions."
authors = [
    { name = "Devjeet Roy" },
]
keywords = [
    "cli-tools",
    "json",
    "data-transformation",
    "expression-evaluation",
    "validation",
    "etl",
    "schema-validation",
    "parser-design",
    "modular-composition",
    "scb-problem",
    "multi-step",
    "pytest",
]

[metadata]
difficulty = "easy"
category = "data-processing"
tags = [
    "cli-tools",
    "json",
    "data-transformation",
    "expression-evaluation",
    "validation",
    "etl",
    "schema-validation",
    "parser-design",
    "modular-composition",
]
source = "scb-problems"
source_problem = "etl_pipeline"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[environment.env]
COLUMNS = "240"
LINES = "60"
PYTHONUNBUFFERED = "1"
TERM = "xterm"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[verifier]
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[[steps]]
name = "checkpoint_1"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 600.0
