schema_version = "1.1"
artifacts = []

[task]
name = "scb-handoff/foundation-layered_config_synthesizer"
description = "CLI that merges layered YAML/JSON configs for ML training with deterministic conflict resolution. Adds fragment expansion, env var interpolation, multi-run manifest processing, and JSON Schema validation. Outputs canonical JSON with sorted keys."
authors = [
    { name = "Changho Shin" },
]
keywords = [
    "cli-tools",
    "yaml",
    "json",
    "mlops",
    "merge-algorithms",
    "schema-validation",
    "template-expansion",
    "env-interpolation",
    "error-handling",
    "file-io",
    "scb-problem",
    "multi-step",
    "pytest",
]

[metadata]
difficulty = "medium"
category = "configuration-management"
tags = [
    "cli-tools",
    "yaml",
    "json",
    "mlops",
    "merge-algorithms",
    "schema-validation",
    "template-expansion",
    "env-interpolation",
    "error-handling",
    "file-io",
]
source = "scb-problems"
source_problem = "layered_config_synthesizer"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[environment.env]
COLUMNS = "240"
LINES = "60"
PYTHONUNBUFFERED = "1"
TERM = "xterm"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[verifier]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = [
    "pypi.org",
    "files.pythonhosted.org",
]

[[steps]]
name = "checkpoint_1"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 1800.0
