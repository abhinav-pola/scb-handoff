schema_version = "1.1"
artifacts = []

[task]
name = "scb-handoff/foundation-eve_jump_planner"
description = "Jump Freighter route planner for EVE Online. Calculates optimal routes with fuel costs, jump fatigue, and 3D spatial distances. Adds cloak-and-jump mechanics for extended range and handles high-sec destinations by finding nearby low-sec entry points."
authors = [
    { name = "Gabriel Orlanski" },
]
keywords = [
    "cli-tools",
    "pathfinding",
    "graph-algorithms",
    "spatial-algorithms",
    "data-processing",
    "csv-parsing",
    "multi-criteria-optimization",
    "domain-modeling",
    "game-mechanics",
    "scb-problem",
    "multi-step",
    "pytest",
]

[metadata]
difficulty = "medium"
category = "algorithms"
tags = [
    "cli-tools",
    "pathfinding",
    "graph-algorithms",
    "spatial-algorithms",
    "data-processing",
    "csv-parsing",
    "multi-criteria-optimization",
    "domain-modeling",
    "game-mechanics",
]
source = "scb-problems"
source_problem = "eve_jump_planner"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[environment.env]
COLUMNS = "240"
LINES = "60"
PYTHONUNBUFFERED = "1"
TERM = "xterm"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[verifier]
timeout_sec = 5400.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[[steps]]
name = "checkpoint_1"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 5400.0
