schema_version = "1.1"
artifacts = []

[task]
name = "scb-handoff/foundation-file_backup"
description = "Backup scheduler CLI that reads YAML configs to run scheduled backup jobs (daily/weekly/once) with glob exclusions. Supports full backups, tar packing, verification mode, and incremental backups using SHA-256 to skip unchanged files."
authors = [
    { name = "Gabriel Orlanski" },
]
keywords = [
    "cli-tools",
    "scheduling",
    "file-io",
    "incremental-backup",
    "yaml",
    "jsonl",
    "glob-patterns",
    "tar-archives",
    "checksums",
    "event-driven",
    "scb-problem",
    "multi-step",
    "pytest",
]

[metadata]
difficulty = "easy"
category = "file-systems"
tags = [
    "cli-tools",
    "scheduling",
    "file-io",
    "incremental-backup",
    "yaml",
    "jsonl",
    "glob-patterns",
    "tar-archives",
    "checksums",
    "event-driven",
]
source = "scb-problems"
source_problem = "file_backup"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[environment.env]
COLUMNS = "240"
LINES = "60"
PYTHONUNBUFFERED = "1"
TERM = "xterm"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[verifier]
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = [
    "pypi.org",
    "files.pythonhosted.org",
]

[[steps]]
name = "checkpoint_1"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 600.0
