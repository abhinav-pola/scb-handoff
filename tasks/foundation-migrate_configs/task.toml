schema_version = "1.1"
artifacts = []

[task]
name = "scb-handoff/foundation-migrate_configs"
description = "Config migration CLI that applies transformation rules to JSON/YAML/TOML/INI files. Supports value replacement, key renaming, pattern matching, array filtering, config inheritance with cycle detection, file relocation, and pre-transformation validation."
authors = [
    { name = "Gabriel Orlanski" },
]
keywords = [
    "file-io",
    "config-management",
    "rules-engine",
    "pattern-matching",
    "data-transformation",
    "multi-format-parsing",
    "json",
    "yaml",
    "scb-problem",
    "multi-step",
    "pytest",
]

[metadata]
difficulty = "easy"
category = "cli-tools"
tags = [
    "file-io",
    "config-management",
    "rules-engine",
    "pattern-matching",
    "data-transformation",
    "multi-format-parsing",
    "json",
    "yaml",
]
source = "scb-problems"
source_problem = "migrate_configs"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[environment.env]
COLUMNS = "240"
LINES = "60"
PYTHONUNBUFFERED = "1"
TERM = "xterm"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[verifier]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[[steps]]
name = "checkpoint_1"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 1800.0
