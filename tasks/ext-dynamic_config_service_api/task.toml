schema_version = "1.1"
artifacts = []

[task]
name = "scb-handoff/ext-dynamic_config_service_api"
description = "REST API for versioned configs with inheritance and deep-merge. Adds JSON Schema validation and multi-format input (JSON/YAML/TOML), then approval workflows with drafts and quorum-based review, and finally OPA/Rego policy enforcement."
authors = [
    { name = "Gabriel Orlanski" },
]
keywords = [
    "rest-api",
    "versioning",
    "config-management",
    "json-schema",
    "yaml",
    "approval-workflow",
    "policy-enforcement",
    "deep-merge",
    "dependency-resolution",
    "scb-problem",
    "multi-step",
    "pytest",
]

[metadata]
difficulty = "medium"
category = "web"
tags = [
    "rest-api",
    "versioning",
    "config-management",
    "json-schema",
    "yaml",
    "approval-workflow",
    "policy-enforcement",
    "deep-merge",
    "dependency-resolution",
]
source = "scb-problems"
source_problem = "dynamic_config_service_api"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[environment.env]
COLUMNS = "240"
LINES = "60"
PYTHONUNBUFFERED = "1"
TERM = "xterm"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[verifier]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = [
    "pypi.org",
    "files.pythonhosted.org",
]

[[steps]]
name = "checkpoint_2"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 1800.0

[[steps]]
name = "checkpoint_3"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 1800.0
