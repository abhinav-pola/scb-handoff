schema_version = "1.1"
artifacts = []

[task]
name = "scb-handoff/foundation-xjq"
description = "CLI query tool for XML/HTML/JSON with XPath and CSS selectors, text extraction modes, file input precedence, and smart XML/JSON output formatting"
authors = [
    { name = "Gabriel Orlanski" },
]
keywords = [
    "cli-tools",
    "xml",
    "html",
    "json",
    "xpath",
    "css-selectors",
    "json-to-xml",
    "data-transformation",
    "query-language",
    "scb-problem",
    "multi-step",
    "pytest",
]

[metadata]
difficulty = "easy"
category = "developer-tools"
tags = [
    "cli-tools",
    "xml",
    "html",
    "json",
    "xpath",
    "css-selectors",
    "json-to-xml",
    "data-transformation",
    "query-language",
]
source = "scb-problems"
source_problem = "xjq"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[environment.env]
COLUMNS = "240"
LINES = "60"
PYTHONUNBUFFERED = "1"
TERM = "xterm"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[verifier]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = [
    "pypi.org",
    "files.pythonhosted.org",
]

[[steps]]
name = "checkpoint_1"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 900.0
