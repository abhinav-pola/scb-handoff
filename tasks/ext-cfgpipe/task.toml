schema_version = "1.1"
artifacts = []

[task]
name = "scb-handoff/ext-cfgpipe"
description = "CLI configuration resolver that reads a JSON schema, resolves typed parameters from prioritized sources (default, env, file, primary/secondary stores, args), supports nested groups, watch mode with structured change events, advanced types (duration, pattern, map, list, redacted), and store prefix composition."
authors = [
    { name = "Gabriel Orlanski" },
]
keywords = [
    "cli-tools",
    "config-management",
    "argument-parsing",
    "schema-validation",
    "http-integration",
    "watch-mode",
    "type-system",
    "deterministic-output",
    "scb-problem",
    "multi-step",
    "pytest",
]

[metadata]
difficulty = "easy"
category = "configuration-management"
tags = [
    "cli-tools",
    "config-management",
    "argument-parsing",
    "schema-validation",
    "http-integration",
    "watch-mode",
    "type-system",
    "deterministic-output",
]
source = "scb-problems"
source_problem = "cfgpipe"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[environment.env]
COLUMNS = "240"
LINES = "60"
PYTHONUNBUFFERED = "1"
TERM = "xterm"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[verifier]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = [
    "pypi.org",
    "files.pythonhosted.org",
]

[[steps]]
name = "checkpoint_2"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "checkpoint_3"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 3600.0
