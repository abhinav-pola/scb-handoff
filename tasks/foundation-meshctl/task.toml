schema_version = "1.1"
artifacts = []

[task]
name = "scb-handoff/foundation-meshctl"
description = "CLI tool for managing distributed cache mesh resources through declarative YAML specifications. Validates specs, applies defaults, persists state, and reports structured JSON to stdout."
authors = [
    { name = "Gabriel Orlanski" },
]
keywords = [
    "yaml",
    "json",
    "resource-management",
    "schema-validation",
    "state-persistence",
    "argument-parsing",
    "crud",
    "declarative-config",
    "distributed-systems",
    "scb-problem",
    "multi-step",
    "pytest",
]

[metadata]
difficulty = "hard"
category = "cli-tools"
tags = [
    "yaml",
    "json",
    "resource-management",
    "schema-validation",
    "state-persistence",
    "argument-parsing",
    "crud",
    "declarative-config",
    "distributed-systems",
]
source = "scb-problems"
source_problem = "meshctl"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[environment.env]
COLUMNS = "240"
LINES = "60"
PYTHONUNBUFFERED = "1"
TERM = "xterm"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "pypi.org",
    "files.pythonhosted.org",
]

[verifier]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = [
    "pypi.org",
    "files.pythonhosted.org",
]

[[steps]]
name = "checkpoint_1"

[[steps.artifacts]]
source = "/app"
destination = "app"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "node_modules",
    "target",
    "dist",
    "build",
]

[steps.min_reward]
core_pass_rate = 0.0
strict_pass_rate = 0.0

[steps.agent]
timeout_sec = 7200.0

[steps.verifier]
timeout_sec = 900.0
